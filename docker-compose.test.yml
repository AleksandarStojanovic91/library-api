# Overrides for automated testing (CI, `make up`, the shared api-tests suite and k6).
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build postgres redis api-java api-ts
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d api-java-future   # time-travel instance
#
# 1. The main instances get a very high rate limit. The suite runs many workers in parallel, all as the same
#    librarian and from the same IP, so the default 120 requests/minute would turn tests into 429s.
#    The rate-limit behaviour itself is tested against the *-future instances, which keep the default.
#
# 2. api-java-future / api-ts-future are a second instance of each implementation on the SAME database with the
#    clock shifted 15.5 days forward (CLOCK_OFFSET_SECONDS). A loan made on the normal instance is overdue when
#    read through the future one, and READY reservations expire there. The api-tests project
#    `<impl>-time-travel` uses them through OVERDUE_BASE_URL. Start them only after the main suite has finished:
#    their background worker expires every READY reservation in the shared database, which would break
#    reservation tests that are still running against the normal instance.

services:
  api-java:
    environment:
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100000}

  api-ts:
    environment:
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100000}

  api-java-future:
    profiles: [time-travel]
    build: { context: ., dockerfile: java/Dockerfile }
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://library:library@postgres:5432/library_java
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_NAMESPACE: rl-future   # own rate-limit counters, shared cache
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes!!}
      CLOCK_OFFSET_SECONDS: ${OVERDUE_OFFSET_SECONDS:-1339200}
      WORKER_INTERVAL_MS: "1000"
    ports: ["8091:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-ts-future:
    profiles: [time-travel]
    build: { context: ., dockerfile: ts/Dockerfile }
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://library:library@postgres:5432/library_ts
      REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_NAMESPACE: rl-future   # own rate-limit counters, shared cache
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes!!}
      CLOCK_OFFSET_SECONDS: ${OVERDUE_OFFSET_SECONDS:-1339200}
      WORKER_INTERVAL_MS: "1000"
    ports: ["8092:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
