name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.test.yml
  K6_IMAGE: grafana/k6:2.3.0

jobs:
  contract:
    name: Contract lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Lint contract/openapi.yaml (Redocly, config in redocly.yaml)
        run: npx --yes @redocly/cli@2.63.0 lint contract/openapi.yaml --format=github-actions

  suite:
    name: API test suite (static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-tests/package-lock.json
      - run: npm ci
      - name: Types are generated from the current contract
        run: |
          npm run generate
          git diff --exit-code -- src/generated || { echo "::error::src/generated is stale, run 'npm run generate' in api-tests"; exit 1; }
      - run: npx tsc --noEmit
      - name: Offline self-tests (contract validator, generators)
        run: npx playwright test --project=unit
      - name: Every test is discoverable
        run: npx playwright test --list > /dev/null

  java:
    name: Java (Spring Boot) build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: java
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_java
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://library:library@localhost:5432/library_java
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify

  ts:
    name: TypeScript (NestJS) build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_ts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://library:library@localhost:5432/library_ts
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    # The same black-box suite against each implementation, built and started exactly as in docker-compose.
    name: Shared API suite against ${{ matrix.impl }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { impl: java, port: 8081, future_port: 8091 }
          - { impl: ts, port: 8082, future_port: 8092 }
    env:
      BASE: http://localhost:${{ matrix.port }}
      FUTURE: http://localhost:${{ matrix.future_port }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-tests/package-lock.json
      - name: Install the suite (API tests need no browsers)
        working-directory: api-tests
        run: npm ci

      - name: Start postgres, redis and api-${{ matrix.impl }}
        id: up
        run: |
          $COMPOSE up -d --build postgres redis api-${{ matrix.impl }}
          timeout 180 bash -c "until curl -fsS $BASE/health/ready; do sleep 2; done"

      - name: Shared suite (project ${{ matrix.impl }})
        working-directory: api-tests
        env:
          PW_REPORT_DIR: playwright-report/${{ matrix.impl }}
        run: npx playwright test --project=${{ matrix.impl }}

      # Started only now: its worker expires READY reservations in the shared database (see docker-compose.test.yml).
      - name: Start the time-travel instance (CLOCK_OFFSET_SECONDS = 15.5 days)
        id: future
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          $COMPOSE up -d --build api-${{ matrix.impl }}-future
          timeout 180 bash -c "until curl -fsS $FUTURE/health/ready; do sleep 2; done"

      - name: Time-travel suite (overdue fees, reservation expiry)
        if: ${{ !cancelled() && steps.future.outcome == 'success' }}
        working-directory: api-tests
        env:
          OVERDUE_BASE_URL: ${{ env.FUTURE }}
          PW_REPORT_DIR: playwright-report/${{ matrix.impl }}-time-travel
        run: npx playwright test --project=${{ matrix.impl }}-time-travel

      # The future instance keeps the default limit of 120/min, so the 429 test can run against it.
      - name: Rate-limit test (429)
        if: ${{ !cancelled() && steps.future.outcome == 'success' }}
        working-directory: api-tests
        env:
          BASE_URL: ${{ env.FUTURE }}
          RATE_LIMIT_TEST: '1'
          PW_REPORT_DIR: playwright-report/${{ matrix.impl }}-rate-limit
        run: npx playwright test --project=${{ matrix.impl }} --grep @rate-limit-429

      - name: Service logs
        if: failure()
        run: $COMPOSE --profile time-travel logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.impl }}
          path: |
            api-tests/playwright-report/
            api-tests/test-results/
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop
        if: always()
        run: $COMPOSE --profile time-travel down -v

  perf-smoke:
    name: k6 smoke against both implementations
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start both implementations
        run: |
          $COMPOSE up -d --build postgres redis api-java api-ts
          for port in 8081 8082; do
            timeout 180 bash -c "until curl -fsS http://localhost:$port/health/ready; do sleep 2; done"
          done
      - name: k6 smoke (1 VU, 30 s, p95 < 300 ms, errors < 1%)
        run: |
          status=0
          for target in java:8081 ts:8082; do
            impl=${target%%:*}; port=${target##*:}
            docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work \
              -e BASE_URL=http://localhost:$port -e IMPL=$impl "$K6_IMAGE" run perf/smoke.js || status=1
          done
          cat perf/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: k6-smoke
          path: perf/results/
          retention-days: 14
      - name: Stop
        if: always()
        run: $COMPOSE down -v
